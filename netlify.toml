[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".next/**"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_ROOT_DOMAIN, NEXT_PUBLIC_VAPID_PUBLIC_KEY, SUPABASE_SERVICE_ROLE_KEY, VAPID_PRIVATE_KEY, CRON_SECRET, VAPID_SUBJECT"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  # PWA service worker must not be cached by the CDN
  from = "/sw.js"
  to = "/sw.js"
  status = 200
  headers = { Cache-Control = "public, max-age=0, must-revalidate", Service-Worker-Allowed = "/" }

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
